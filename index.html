<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>こども免許カード印刷</title>
<style>
:root{
  --bg:#f5f5f4; --card:#ffffff; --ink:#1c1917; --sub:#78716c; --accent:#ea580c; --line:#e7e5e4;
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1c1917; --card:#292524; --ink:#f5f5f4; --sub:#a8a29e; --line:#44403c; } }
:root[data-theme="dark"]{ --bg:#1c1917; --card:#292524; --ink:#f5f5f4; --sub:#a8a29e; --line:#44403c; }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Meiryo",sans-serif;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));}
h1{font-size:17px;margin:0 0 4px;}
p.desc{color:var(--sub);font-size:13px;margin:0 0 16px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--sub);}
input[type=text],input[type=date]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;margin-bottom:14px;}
.field{margin-bottom:2px;}
.photo-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;}
.pick-btn{display:block;flex:1;padding:12px;border:1.5px dashed var(--accent);border-radius:10px;background:transparent;color:var(--accent);font-weight:600;font-size:14px;text-align:center;cursor:pointer;}
.cropbox{position:relative;width:160px;height:200px;overflow:hidden;border-radius:8px;border:1px solid var(--line);touch-action:none;background:var(--bg);flex:none;}
.cropbox img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;}
.zoomrow{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.zoomrow input[type=range]{flex:1;}
button.primary{width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;}
button.secondary{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:14px;margin-top:8px;}
.previewWrap{display:flex;justify-content:center;margin-bottom:16px;}
.card{position:relative;width:105.03mm;height:148.04mm;background:#fff;box-shadow:0 0 0 1px var(--line);overflow:hidden;}
.card img.guide{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.35;object-fit:fill;}
.ov{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;white-space:nowrap;color:#000;font-family:"Meiryo UI","Meiryo","Hiragino Sans",sans-serif;}
.ov.bold{font-weight:700;}
.ov img{width:100%;height:100%;object-fit:cover;}
.hint{font-size:12px;color:var(--sub);line-height:1.6;}
@media print{
  body{background:#fff;padding:0;margin:0;}
  .no-print{display:none!important;}
  .previewWrap{margin:0;}
  .card{box-shadow:none;width:105mm;height:148mm;}
  .card img.guide{display:none;}
  @page{size:105mm 148mm;margin:0;}
}
</style>
</head>
<body>
<div class="no-print">
<h1>こども免許カード 印刷ツール</h1>
<p class="desc">こうふび・てんぽめいは共通、おなまえ・かおしゃしんは上下カードでそれぞれ別々に入力できます。</p>

<div class="panel">
  <div class="field"><label>こうふび(共通)</label>
  <input type="date" id="date"></div>

  <div class="field"><label>てんぽめい(共通)</label>
  <input type="text" id="store" placeholder="例:スーパーオートバックス大野城御笠川店"></div>
</div>

<div class="panel">
  <p class="hint" style="margin:0 0 10px;font-weight:600;color:var(--ink);">上のカード</p>
  <div class="field"><label>おなまえ(上)</label>
  <input type="text" id="name1in" placeholder="例:みきこ" maxlength="10"></div>
  <label>かおしゃしん(上)</label>
  <div class="photo-row">
    <div class="cropbox" id="cropbox1"><img id="cropimg1" style="display:none;"></div>
    <div style="flex:1;">
      <input type="file" accept="image/*" id="filepick1" style="display:none;">
      <label class="pick-btn" for="filepick1" id="pickBtn1">撮影 / 選択</label>
      <div class="zoomrow" id="zoomrow1" style="display:none;">
        <span style="font-size:12px;color:var(--sub);">拡大</span>
        <input type="range" id="zoom1" min="100" max="300" value="100">
      </div>
      <p class="hint">ドラッグで位置調整、スライダーで拡大</p>
    </div>
  </div>
</div>

<div class="panel">
  <p class="hint" style="margin:0 0 10px;font-weight:600;color:var(--ink);">下のカード</p>
  <div class="field"><label>おなまえ(下)</label>
  <input type="text" id="name2in" placeholder="例:みきこ" maxlength="10"></div>
  <label>かおしゃしん(下)</label>
  <div class="photo-row">
    <div class="cropbox" id="cropbox2"><img id="cropimg2" style="display:none;"></div>
    <div style="flex:1;">
      <input type="file" accept="image/*" id="filepick2" style="display:none;">
      <label class="pick-btn" for="filepick2" id="pickBtn2">撮影 / 選択</label>
      <div class="zoomrow" id="zoomrow2" style="display:none;">
        <span style="font-size:12px;color:var(--sub);">拡大</span>
        <input type="range" id="zoom2" min="100" max="300" value="100">
      </div>
      <p class="hint">ドラッグで位置調整、スライダーで拡大</p>
    </div>
  </div>
</div>

<div class="panel">
  <button class="primary" id="printBtn" type="button">印刷する</button>
  <button class="secondary" id="updateBtn" type="button">プレビュー更新</button>
  <p class="hint" style="margin-top:10px;">印刷ダイアログでは用紙サイズ「はがき/ポストカード(100×148mm)」を選び、拡大縮小は「100%/実寸」にしてください。背景の薄いガイド画像は確認用で、印刷時には出力されません。</p>
</div>
</div>

<div class="previewWrap">

<script>
(function(){
  var name1El=document.getElementById('name1in'), name2El=document.getElementById('name2in');
  var dateEl=document.getElementById('date'), storeEl=document.getElementById('store');
  try{
    var savedStore=localStorage.getItem('kids_license_store');
    if(savedStore) storeEl.value=savedStore;
  }catch(e){}
  var today=new Date();
  dateEl.value=today.toISOString().slice(0,10);
  try{
    var savedDate=localStorage.getItem('kids_license_date');
    if(savedDate) dateEl.value=savedDate;
  }catch(e){}

  function fitText(el){
    if(!el.dataset.baseSize){ el.dataset.baseSize=parseFloat(getComputedStyle(el).fontSize); }
    var max=parseFloat(el.dataset.baseSize);
    el.style.fontSize=max+'pt';
    var tries=0;
    while(el.scrollWidth>el.clientWidth && max>5 && tries<20){
      max-=0.5; el.style.fontSize=max+'pt'; tries++;
    }
  }

  function render(){
    ['name1','name2'].forEach(function(id,i){var el=document.getElementById(id); el.textContent=(i===0?name1El.value:name2El.value)||''; fitText(el);});
    var d=dateEl.value; var dtxt='';
    if(d){ var p=d.split('-'); dtxt=parseInt(p[0])+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日'; }
    var s=storeEl.value||'';
    ['date1','date2'].forEach(function(id){var el=document.getElementById(id); el.textContent=dtxt; fitText(el);});
    ['store1','store2'].forEach(function(id){var el=document.getElementById(id); el.textContent=s; fitText(el);});
    try{ localStorage.setItem('kids_license_store', s); localStorage.setItem('kids_license_date', d); }catch(e){}
  }
  [name1El,name2El,dateEl,storeEl].forEach(function(el){
    ['input','change'].forEach(function(ev){ el.addEventListener(ev,render); });
  });
  render();

  // reusable photo cropper factory
  function createCropper(suffix, targetId){
    var cropbox=document.getElementById('cropbox'+suffix), img=document.getElementById('cropimg'+suffix);
    var filepick=document.getElementById('filepick'+suffix);
    var zoom=document.getElementById('zoom'+suffix), zoomrow=document.getElementById('zoomrow'+suffix);
    var BOXW=160, BOXH=200; // aspect 0.8:1 matches print target 25.00 x 31.25mm
    var natW=0,natH=0, baseScale=1, curScale=1, tx=0, ty=0, dragging=false, startX=0,startY=0,origTx=0,origTy=0;

    var curObjUrl=null;
    filepick.addEventListener('change',function(e){
      var f=e.target.files[0]; if(!f) return;
      if(curObjUrl){ URL.revokeObjectURL(curObjUrl); }
      curObjUrl=URL.createObjectURL(f);
      img.onload=function(){
        natW=img.naturalWidth; natH=img.naturalHeight;
        baseScale=Math.max(BOXW/natW, BOXH/natH);
        curScale=baseScale; zoom.value=100;
        tx=(BOXW-natW*curScale)/2; ty=(BOXH-natH*curScale)/2;
        applyT(); img.style.display='block'; zoomrow.style.display='flex';
        exportPhoto();
      };
      img.onerror=function(){ alert('この画像を読み込めませんでした。別の写真でお試しください。'); };
      img.src=curObjUrl;
    });

    function clamp(){
      var w=natW*curScale, h=natH*curScale;
      if(tx>0) tx=0; if(ty>0) ty=0;
      if(tx< BOXW-w) tx=BOXW-w; if(ty< BOXH-h) ty=BOXH-h;
      if(w<=BOXW) tx=(BOXW-w)/2; if(h<=BOXH) ty=(BOXH-h)/2;
    }
    function applyT(){ clamp(); img.style.transform='translate('+tx+'px,'+ty+'px) scale('+curScale+')'; }

    zoom.addEventListener('input',function(){
      var f=zoom.value/100; curScale=baseScale*f; applyT(); exportPhoto();
    });

    function ptStart(x,y){ dragging=true; startX=x; startY=y; origTx=tx; origTy=ty; }
    function ptMove(x,y){ if(!dragging) return; tx=origTx+(x-startX); ty=origTy+(y-startY); applyT(); }
    function ptEnd(){ if(dragging){dragging=false; exportPhoto();} }

    cropbox.addEventListener('mousedown',function(e){ptStart(e.clientX,e.clientY);});
    window.addEventListener('mousemove',function(e){ptMove(e.clientX,e.clientY);});
    window.addEventListener('mouseup',ptEnd);
    cropbox.addEventListener('touchstart',function(e){var t=e.touches[0];ptStart(t.clientX,t.clientY);},{passive:true});
    cropbox.addEventListener('touchmove',function(e){var t=e.touches[0];ptMove(t.clientX,t.clientY);e.preventDefault();},{passive:false});
    cropbox.addEventListener('touchend',ptEnd);

    function exportPhoto(){
      if(!natW) return;
      var EXW=500, EXH=625; // 0.8:1 export resolution
      var c=document.createElement('canvas'); c.width=EXW; c.height=EXH;
      var ctx=c.getContext('2d');
      var f=EXW/BOXW;
      ctx.drawImage(img, tx*f, ty*f, natW*curScale*f, natH*curScale*f);
      var url=c.toDataURL('image/jpeg',0.92);
      document.getElementById(targetId).innerHTML='<img src="'+url+'">';
    }
  }
  createCropper('1','photo1');
  createCropper('2','photo2');

  document.getElementById('updateBtn').addEventListener('click',render);
  document.getElementById('printBtn').addEventListener('click',function(){ render(); window.print(); });
})();
</script>
